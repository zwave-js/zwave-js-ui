# Update a dependency On-Demand

name: Update dependency On-Demand

on:
  workflow_dispatch:
    inputs:
      dep:
        description: 'Dependency'
        required: true
        default: 'zwave-js'
      version:
        description: 'Version'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: 'npm'

      - name: Update dependency
        env:
          DEP: ${{ github.event.inputs.dep }}
          VERSION: ${{ github.event.inputs.version || 'latest' }}
        run: |
          # A dispatch right after a release can arrive before the registry serves
          # the new version. Poll with --prefer-online so the cached packument
          # restored by setup-node does not hide it.
          for attempt in $(seq 20); do
            if npm view --prefer-online "$DEP@$VERSION" version > /dev/null 2>&1; then
              break
            fi
            echo "$DEP@$VERSION is not available on the registry yet, retrying in 30s ($attempt/20)"
            sleep 30
          done
          # Fail here with a clear message if the version never showed up
          npm view --prefer-online "$DEP@$VERSION" version

          if [ "$DEP" = "zwave-js" ]; then
            npm install --save-exact "$DEP@$VERSION"
          else
            npm install "$DEP@$VERSION"
          fi
      - name: Check for changes
        id: check
        run: |
          git diff --name-only || true
          if ! git diff --quiet ; then
            echo "Has changes"
            echo "changed=true" >> $GITHUB_OUTPUT
            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION=$(npm info "${{ github.event.inputs.dep }}" version)
            fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "No changes detected. Dependency already up to date"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      - name: Create Pull Request
        if: ${{ steps.check.outputs.changed == 'true' }}
        id: cpr
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.BOT_TOKEN }}
          commit-message: "feat: bump ${{github.event.inputs.dep}}@${{ steps.check.outputs.version }}"
          committer: Z-Wave JS Bot <bot@zwave-js.io>
          author: Z-Wave JS Bot <bot@zwave-js.io>
          signoff: false
          branch: "${{github.event.inputs.dep}}@${{ steps.check.outputs.version }}"
          delete-branch: true
          title: "feat: bump ${{github.event.inputs.dep}}@${{ steps.check.outputs.version }}"
          body: |
            Update ${{github.event.inputs.dep}} to version ${{ steps.check.outputs.version }}
          labels: |
            dependencies
            workflow-bump
          base: master
          draft: false

      - name: Check outputs
        if: ${{ steps.check.outputs.changed == 'true' }}
        run: |
          echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"
