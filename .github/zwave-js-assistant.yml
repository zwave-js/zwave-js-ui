# Offer the fix lint bot command
offerLintFix:
  # Which job name to look for
  jobName: test
  # Define which linter outputs should be checked for auto-fixability
  linters:
    - eslint
    - prettier

# Check whether the resulting squash-commit will be semantic
semanticSquash: true

# Bump zwave-js when a new version is released
onRelease:
  - repo: zwave-js/zwave-js
    workflow: update-dep.yml
    ref: master
    inputs:
      dep: zwave-js
      version: '{version}'
